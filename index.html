<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="Digital-7Mono.woff2" as="font" type="font/woff2" crossorigin>
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Calculator</h1>
        <p id="display"></p>
    </header>
    <main>
        <button id="clear">Clear</button>
        <button id="del">Delete</button>
        <div>
            <button class="btn" value="7">7</button>
            <button class="btn" value="8">8</button>
            <button class="btn" value="9">9</button>
            <button class="operator" value="divide">/</button>
        </div>

        <div>
            <button class="btn" value="4">4</button>
            <button class="btn" value="5">5</button>
            <button class="btn" value="6">6</button>
            <button class="operator" value="multiply">*</button>
        </div>

        <div>
            <button class="btn" value="1">1</button>
            <button class="btn" value="2">2</button>
            <button class="btn" value="3">3</button>
            <button class="operator" value="subtract">-</button>
        </div>

        <div>
            <button class="btn" value="0">0</button>
            <button class="btn" id="decimal" value=".">.</button>
            <button id="equals">=</button>
            <button class="operator" value="add">+</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
